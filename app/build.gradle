plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

// Firebase hanya diaktifkan kalau file google-services.json ada.
// Di GitHub Actions file ini dibuat dari secret GOOGLE_SERVICES_JSON.
def hasFirebase = file('google-services.json').exists()
if (hasFirebase) {
    apply plugin: 'com.google.gms.google-services'
    apply plugin: 'com.google.firebase.crashlytics'
}

// Nomor versi otomatis dari GitHub Actions (run number), supaya pembaruan otomatis bisa membandingkan versi.
def ciRun = System.getenv('GITHUB_RUN_NUMBER') ?: '1'
def appVersionCode = ciRun.toInteger()
def appVersionName = "1.0.${ciRun}"

// Kunci tanda tangan. Semua APK harus memakai kunci yang SAMA agar pembaruan bisa dipasang.
// Urutan: (1) GitHub Secrets di Actions, (2) file signing/keystore.properties untuk build di Termux.
def ksFile = System.getenv('SIGNING_KEYSTORE_PATH')
def ksStorePass = System.getenv('SIGNING_STORE_PASSWORD')
def ksAlias = System.getenv('SIGNING_KEY_ALIAS')
def ksKeyPass = System.getenv('SIGNING_KEY_PASSWORD')
def localProps = rootProject.file('signing/keystore.properties')
if ((ksFile == null || !file(ksFile).exists()) && localProps.exists()) {
    def p = new Properties()
    localProps.withInputStream { p.load(it) }
    ksFile = file(p.getProperty('storeFile')).absolutePath
    ksStorePass = p.getProperty('storePassword')
    ksAlias = p.getProperty('keyAlias')
    ksKeyPass = p.getProperty('keyPassword')
}
def hasSigning = ksFile != null && file(ksFile).exists()

// ID proyek Firebase untuk link undangan tamu (https://<id>.web.app/join/...)
def hostingId = System.getenv('FIREBASE_PROJECT_ID') ?: 'stream-by-natan-29448'

android {
    namespace 'com.natan.streambynatan'
    compileSdk 36

    defaultConfig {
        applicationId 'com.natan.streambynatan'
        minSdk 26
        targetSdk 35
        versionCode appVersionCode
        versionName appVersionName
        buildConfigField 'boolean', 'HAS_FIREBASE', hasFirebase.toString()
        buildConfigField 'String', 'GITHUB_REPO', '"gurundanatan-sketch/Stream-By-Natan"'
        // Alamat halaman undangan tamu & halaman unduh (Firebase Hosting)
        buildConfigField 'String', 'HOSTING_URL', "\"https://${hostingId}.web.app\""
        manifestPlaceholders = [hostingHost: "${hostingId}.web.app", hostingHost2: "${hostingId}.firebaseapp.com"]
        vectorDrawables { useSupportLibrary true }
        // HP Android modern (32 & 64 bit). Membuat APK lebih kecil karena FFmpeg & WebRTC cukup besar.
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }

    signingConfigs {
        if (hasSigning) {
            release {
                storeFile file(ksFile)
                storePassword ksStorePass
                keyAlias ksAlias
                keyPassword ksKeyPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (hasSigning) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            // debug juga memakai kunci pribadi supaya bisa saling menimpa
            if (hasSigning) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}', 'META-INF/INDEX.LIST', 'META-INF/io.netty.versions.properties', 'META-INF/DEPENDENCIES']
        }
        jniLibs { useLegacyPackaging = true }
    }

    androidResources {
        noCompress += ['ogg', 'mp3', 'wav', 'tflite']
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

// RNNoise 1.0.2 menandai dirinya "butuh compileSdk 37", padahal isinya hanya kode C (JNI)
// yang tidak memakai API Android baru. Pemeriksaan ini dilewati supaya build tidak gagal.
tasks.configureEach { t ->
    if (t.name ==~ /check.*AarMetadata/) t.enabled = false
}

kotlin {
    jvmToolchain(17)
    compilerOptions {
        freeCompilerArgs.addAll(['-Xskip-metadata-version-check', '-opt-in=kotlin.RequiresOptIn'])
    }
}

dependencies {
    // Streaming RTMP (YouTube + TikTok sekaligus), rekam, filter, sumber layar/kamera/USB
    implementation 'com.github.pedroSG94.RootEncoder:library:2.7.0'
    implementation 'com.github.pedroSG94.RootEncoder:extra-sources:2.7.0'

    // AndroidX inti
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-service:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.datastore:datastore-preferences:1.1.1'

    // Tampilan Compose (tema futuristik)
    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.animation:animation'

    // Kamera (facecam, analisis wajah, ganti latar)
    implementation 'androidx.camera:camera-core:1.5.2'
    implementation 'androidx.camera:camera-camera2:1.5.2'
    implementation 'androidx.camera:camera-lifecycle:1.5.2'
    implementation 'androidx.camera:camera-view:1.5.2'

    // Jaringan, JSON
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.10.2'

    // Firebase: Auth, Firestore, Cloud Messaging, Crashlytics, Analytics
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-crashlytics'
    implementation 'com.google.firebase:firebase-analytics'

    // Login Google untuk YouTube (izin resmi)
    implementation 'com.google.android.gms:play-services-auth:21.3.0'
    // Login dengan Google (Credential Manager) untuk Firebase Auth
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'

    // ML Kit (offline): terjemahan, deteksi bahasa, pisah latar, deteksi wajah
    implementation 'com.google.mlkit:translate:17.0.3'
    implementation 'com.google.mlkit:language-id:17.0.6'
    implementation 'com.google.mlkit:segmentation-selfie:16.0.0-beta6'
    implementation 'com.google.mlkit:face-detection:16.1.7'

    // FFmpeg: potong rekaman per pertanyaan/poin & ambil suara dari video untuk efek suara
    implementation 'com.moizhassan.ffmpeg:ffmpeg-kit-16kb:6.1.1'

    // Lottie: animasi efek cahaya & partikel di layar pembuka/penutup sinematik
    implementation 'com.airbnb.android:lottie:6.4.0'

    // RNNoise: peredam bising kuat berbasis AI (offline)
    implementation 'cn.enaium.rnnoise:rnnoise-kmp-android:1.0.2'

    // Tink: enkripsi stream key & API key (bersama DataStore & Android Keystore)
    implementation 'com.google.crypto.tink:tink-android:1.15.0'

    // Kode QR Saweria
    implementation 'com.google.zxing:core:3.5.3'

    // Tamu & kamera tambahan lewat WebRTC
    implementation 'io.getstream:stream-webrtc-android:1.3.8'
}
