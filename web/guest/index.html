<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gabung Live · Stream By Natan</title>
<style>
  :root{--void:#070A14;--deep:#0B1022;--cyan:#22E5FF;--violet:#8B5CFF;--pink:#FF3DA8;--text:#F2F5FF;--muted:#A6B0CF;--line:rgba(255,255,255,.2)}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 10%,rgba(139,92,255,.35),transparent 50%),radial-gradient(circle at 90% 60%,rgba(34,229,255,.25),transparent 50%),var(--void);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
  h1{font-size:30px;margin:8px 0;background:linear-gradient(90deg,var(--cyan),var(--violet),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
  .card{background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:22px;padding:18px;margin:14px 0}
  label{display:block;font-weight:600;margin-bottom:6px}
  input{width:100%;font-size:18px;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--deep);color:var(--text)}
  button{width:100%;min-height:56px;font-size:17px;font-weight:700;border:0;border-radius:18px;margin-top:10px;cursor:pointer;color:var(--void);background:linear-gradient(90deg,var(--cyan),var(--violet),var(--pink))}
  button.ghost{background:rgba(255,255,255,.1);color:var(--text);border:1px solid var(--line)}
  button:disabled{opacity:.5}
  video{width:100%;border-radius:18px;background:#000;aspect-ratio:9/16;object-fit:cover}
  .row{display:flex;gap:10px}.row button{flex:1}
  .status{font-size:18px;line-height:1.5}
  .muted{color:var(--muted)}
  [hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1>Gabung Live</h1>
  <p class="muted" id="intro">Kamu diundang ke siaran Stream By Natan.</p>

  <section class="card" id="joinCard">
    <label for="name">Nama kamu</label>
    <input id="name" autocomplete="name" placeholder="Contoh: Budi">
    <button id="joinBtn">Masuk ruang tunggu</button>
  </section>

  <section class="card" id="statusCard" hidden>
    <p class="status" id="status" role="status" aria-live="polite">Menyiapkan…</p>
  </section>

  <section class="card" id="mediaCard" hidden>
    <video id="preview" autoplay playsinline muted aria-label="Pratinjau kamera kamu"></video>
    <div class="row">
      <button class="ghost" id="micBtn" aria-pressed="true">Matikan mikrofon</button>
      <button class="ghost" id="camBtn" aria-pressed="true">Matikan kamera</button>
    </div>
    <button class="ghost" id="screenBtn">Bagikan layar</button>
    <button class="ghost" id="flipBtn">Ganti kamera depan/belakang</button>
    <button class="ghost" id="leaveBtn">Keluar</button>
  </section>
  <audio id="hostAudio" autoplay></audio>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script src="guest.js"></script>
</body>
</html>
