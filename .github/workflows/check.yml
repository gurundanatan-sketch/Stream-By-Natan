name: Pemeriksaan kode

on:
  pull_request:
  push:
    branches-ignore: [ "main", "master" ]
  workflow_dispatch:

jobs:
  python:
    name: Skrip Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cek sintaks semua skrip Python
        run: python -m py_compile scripts/*.py
      - name: Buat efek suara cadangan (tanpa internet) & cek nama file
        run: |
          python scripts/make_lottie.py
          OFFLINE_ASSETS=1 python scripts/download_assets.py
          python scripts/check_project.py

  web:
    name: Halaman tamu (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Cek sintaks JavaScript
        run: node --check web/guest/guest.js
      - name: Cek JSON Firebase
        run: python3 -c "import json;json.load(open('firebase.json'))"

  android:
    name: Kompilasi Android (debug)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Aset suara cadangan
        run: OFFLINE_ASSETS=1 python3 scripts/download_assets.py
      - name: Validasi Gradle Wrapper asli
        uses: gradle/actions/wrapper-validation@v4
      - name: Kompilasi
        run: chmod +x gradlew && ./gradlew --no-daemon assembleDebug
      - name: Lint (laporan saja)
        continue-on-error: true
        run: ./gradlew --no-daemon lintDebug
      - name: Simpan laporan lint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laporan-lint
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
