name: Build APK Stream By Natan

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Validasi Gradle Wrapper asli
        uses: gradle/actions/wrapper-validation@v4

      - name: Pasang JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle


      - name: Pasang Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pasang ffmpeg (untuk mengecilkan file suara)
        run: sudo apt-get update -y && sudo apt-get install -y ffmpeg || true

      - name: Buat animasi Lottie
        run: python scripts/make_lottie.py

      - name: Unduh 200 efek suara, 20 musik latar, video latar sinematik (Commons, Kenney, Incompetech, Pexels/Pixabay)
        continue-on-error: true
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python scripts/download_assets.py

      - name: Periksa nama aset
        run: python scripts/check_project.py

      - name: Siapkan google-services.json (kalau ada secret)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "Firebase AKTIF"
          else
            echo "Secret GOOGLE_SERVICES_JSON belum diisi: Firebase dinonaktifkan untuk build ini."
          fi

      - name: Siapkan kunci tanda tangan (kalau ada secret)
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "HAS_SIGNING=true" >> "$GITHUB_ENV"
            echo "Kunci pribadi ditemukan: APK bisa menimpa versi lama tanpa uninstall."
          else
            echo "HAS_SIGNING=false" >> "$GITHUB_ENV"
            echo "::warning::Secret SIGNING_KEYSTORE_BASE64 belum diisi. APK tetap dibuat sebagai artifact, tapi TIDAK diterbitkan ke Releases supaya pembaruan otomatis tidak rusak. Lihat signing/BACA-SAYA.txt."
          fi

      - name: Izinkan gradlew dijalankan
        run: chmod +x gradlew

      - name: Bangun APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Periksa tanda tangan APK
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/*.apk | head -5 || true

      - name: Beri nama APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk "out/StreamByNatan-v1.0.${GITHUB_RUN_NUMBER}.apk"
          ls -la out

      - name: Simpan APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: StreamByNatan-apk
          path: out/*.apk

      - name: Terbitkan ke halaman Releases (untuk pembaruan otomatis)
        if: github.event_name != 'pull_request' && env.HAS_SIGNING == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Stream By Natan v1.0.${{ github.run_number }}
          body: |
            Versi otomatis dari GitHub Actions.
            versionCode: ${{ github.run_number }}
          files: out/*.apk
          make_latest: true
